# 서버 배포용 설정. 실행할 때 --spring.profiles.active=prod 를 주면 이 설정이 기본값을 덮어쓴다.
# 예) java -jar archive.jar --spring.profiles.active=prod

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mydatabase}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.thymeleaf.cache=true

# 사진이 쌓이는 곳. 서버에서는 백업이 도는 경로로 지정하세요.
archive.storage.location=${PHOTO_DIR:/var/archive/uploads}
