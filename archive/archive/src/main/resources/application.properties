    spring.application.name=archive

    spring.docker.compose.enabled=false

# DB_PATH 를 주지 않으면 실행한 폴더 기준(./data)이라, 배포 폴더를 갈아끼우면 데이터가 사라진다.
# 서버에서는 반드시 배포 폴더 바깥의 절대 경로를 넣을 것. 예) DB_PATH=/var/archive/db/localdb
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/localdb};MODE=MySQL;DB_CLOSE_DELAY=-1
    spring.datasource.driver-class-name=org.h2.Driver
    spring.datasource.username=sa
    spring.datasource.password=
    spring.h2.console.enabled=true

    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
# 여러 장을 한 번에 보내므로 요청 전체 한도는 넉넉히 잡는다
spring.servlet.multipart.max-request-size=200MB

# 한 번에 보낼 수 있는 사진 장수
archive.upload.max-count=10

# --- 직원용 관리자 비밀번호 (운영 시 반드시 환경변수로 덮어쓰세요) ---
archive.admin.password=${ARCHIVE_ADMIN_PASSWORD:1234}


# 사진도 마찬가지. 서버에서는 PHOTO_DIR=/var/archive/uploads 처럼 절대 경로로 준다.
archive.storage.location=${PHOTO_DIR:./uploads}




    server.servlet.session.tracking-modes=cookie
    server.servlet.session.cookie.http-only=true
    server.servlet.session.cookie.same-site=lax


# --- 사진 도착 알림 메일 ---
archive.notify.enabled=true
archive.notify.to=dkekdmf@naver.com
# 보내는 주소는 아래 SMTP 로그인 계정과 같아야 한다. 다르면 네이버가 발송을 거부한다.
# 네이버는 보내는 주소가 로그인한 계정과 다르면 거부한다
archive.notify.from=dkekdmf@naver.com
archive.notify.base-url=http://localhost:8080

# --- SMTP (네이버 메일 기준) ---
# MAIL_USERNAME / MAIL_PASSWORD 를 환경변수로 넣어야 실제로 발송된다.
# 네이버는 로그인 비밀번호가 아니라 "2단계 인증 > 애플리케이션 비밀번호" 를 쓴다.
spring.mail.host=smtp.naver.com
spring.mail.port=465
# 네이버 SMTP 는 전체 메일주소가 아니라 아이디만 받는다 (dkekdmf@naver.com 아님)
spring.mail.username=dkekdmf
spring.mail.password=FBVM1UKWV7GW
spring.mail.properties.mail.smtp.auth=true
# 465 는 연결하자마자 SSL 로 감싸는 방식이라 ssl.enable 을 켜야 한다.
# (587 을 쓸 경우에는 반대로 ssl.enable=false, starttls.enable=true 로 바꿔야 한다)
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com

# 메일은 업로드가 끝난 뒤 별도 스레드에서 나가므로 어르신을 기다리게 하지 않는다.
# 5초는 너무 짧아 정상 발송도 끊길 수 있어 20초로 둔다.
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

    spring.thymeleaf.cache=false
