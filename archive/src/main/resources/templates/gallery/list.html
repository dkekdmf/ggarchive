<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#3b5bdb">
	<title>행사 사진 확인</title>
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/gallery.css}">
</head>
<body>

<header class="app-bar">
	<div class="inner">
		<h1>행사 사진</h1>

		<div class="counters">
			<span class="counter">오늘 <b th:text="${todayCount}">0</b>건</span>
			<span class="counter" th:classappend="${uncheckedCount > 0} ? 'alert'">
				확인 안 한 것 <b th:text="${uncheckedCount}">0</b>건
			</span>
		</div>

		<span class="spacer"></span>

		<a th:href="@{/}" class="ghost-btn">사진 보내기</a>

		<span class="admin-chip" th:if="${isAdmin}">관리자</span>
		<form th:if="${isAdmin}" method="post" th:action="@{/admin/logout}">
			<button type="submit" class="ghost-btn">관리 끝내기</button>
		</form>
		<a th:unless="${isAdmin}" th:href="@{/admin/login}" class="ghost-btn">직원 로그인</a>
	</div>
</header>

<main>
	<div class="notice" th:if="${notice}" th:text="${notice}">알림</div>
	<!-- 보기 방식 전환 -->
	<nav class="view-tabs">
		<a th:href="@{/gallery}" class="on">목록</a>
		<a th:href="@{/gallery/calendar}">달력</a>
	</nav>

	<form class="filters" method="get" th:action="@{/gallery}">
		<div>
			<label for="name">행사 이름 또는 보낸 분</label>
			<input type="text" id="name" name="name" th:value="${name}" placeholder="">
		</div>
		<div>
			<label for="from">행사일 (시작)</label>
			<input type="date" id="from" name="from" th:value="${from}">
		</div>
		<div>
			<label for="to">행사일 (종료)</label>
			<input type="date" id="to" name="to" th:value="${to}">
		</div>
		<label class="check">
			<input type="checkbox" name="onlyUnchecked" value="true" th:checked="${onlyUnchecked}">
			확인 안 한 것만
		</label>
		<button type="submit" class="submit">찾기</button>
		<a class="reset" th:href="@{/gallery}">전체 보기</a>
	</form>

	<div class="empty" th:if="${events.isEmpty()}">
		<span class="mark" aria-hidden="true">🗂</span>
		조건에 맞는 행사 사진이 없습니다.
	</div>

	<!-- 행사한 날별로 묶어서 보여 준다. 카드에는 대표 사진과 제목만, 자세한 것은 눌러서 본다. -->
	<div th:unless="${events.isEmpty()}">
		<section class="date-group" th:each="group : ${groups}">

			<div class="date-head">
				<h2 th:text="${#temporals.format(group.key, 'yyyy년 M월 d일 (E)')}">2026년 8월 14일 (목)</h2>
				<span class="today-badge" th:if="${group.key.equals(today)}">오늘</span>
				<span class="date-count" th:text="${group.value.size()} + '건'">3건</span>
				<span class="date-rule"></span>
			</div>

			<div class="events">
				<!-- 내려받기 단추를 넣어야 하므로 카드 전체를 링크로 감싸지 않는다 -->
				<article class="event-card" th:each="event : ${group.value}"
				         th:classappend="${event.checked} ? 'is-checked'">

					<a class="card-link" th:href="@{/gallery/events/{id}(id=${event.id}, back=${currentUrl})}">
						<div class="cover">
							<img th:if="${event.photoCount > 0}" loading="lazy"
							     th:src="@{/gallery/photos/{id}/file(id=${event.photos[0].id})}"
							     th:alt="${event.title} + ' 대표 사진'">
							<span class="cover-count" th:if="${event.photoCount > 1}"
							      th:text="'+' + (${event.photoCount} - 1)">+2</span>
							<span class="checked-badge" th:if="${event.checked}">확인함</span>
						</div>

						<div class="event-body">
							<div class="event-title" th:text="${event.title}">경로당 생신잔치</div>
							<div class="event-meta">
								<span class="sender" th:text="${event.senior.displayName}">김순자</span>
								<span class="dot">·</span>
								<span th:text="'사진 ' + ${event.photoCount} + '장'">사진 3장</span>
							</div>
						</div>
					</a>

					<div class="card-foot" th:if="${event.photoCount > 0}">
						<a class="download-btn" th:href="@{/gallery/events/{id}/photos.zip(id=${event.id})}"
						   th:text="'사진 ' + ${event.photoCount} + '장 내려받기'">사진 3장 내려받기</a>
					</div>
				</article>
			</div>
		</section>
	</div>

	<div class="pager" th:if="${events.totalPages > 1}">
		<a th:if="${!events.first}"
		   th:href="@{/gallery(name=${name},from=${from},to=${to},onlyUnchecked=${onlyUnchecked},page=${events.number - 1})}">이전</a>
		<span th:unless="${!events.first}" class="disabled">이전</span>

		<span class="current" th:text="${events.number + 1} + ' / ' + ${events.totalPages}">1 / 3</span>

		<a th:if="${!events.last}"
		   th:href="@{/gallery(name=${name},from=${from},to=${to},onlyUnchecked=${onlyUnchecked},page=${events.number + 1})}">다음</a>
		<span th:unless="${!events.last}" class="disabled">다음</span>
	</div>
</main>

</body>
</html>
