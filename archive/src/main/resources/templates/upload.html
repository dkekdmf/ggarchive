<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#3b5bdb">
	<title>사진 보내기</title>
	<link rel="stylesheet" th:href="@{/css/base.css}">
	<link rel="stylesheet" th:href="@{/css/senior.css}">
</head>
<body>

<header class="app-bar">
	<span class="service">사진 보내기</span>
	<a th:href="@{/}" class="who">행사 보기</a>
</header>

<main class="page">

	<div class="steps" id="stepBar">
		<span class="step-label" id="stepLabel">1단계 / 2단계</span>
		<span class="step on" id="stepMark1"></span>
		<span class="step" id="stepMark2"></span>
	</div>

	<div class="error" th:if="${error}" th:text="${error}">오류</div>

	<form method="post" th:action="@{/upload}" enctype="multipart/form-data" id="uploadForm">

		<!-- ===== 1단계: 행사 정보 ===== -->
		<div id="step-info" class="card">
			<h1>어떤 행사인가요?</h1>

			<div class="field">
				<label for="title">행사 이름</label>
				<input type="text" id="title" name="title" maxlength="100"
				       autocomplete="off" required>
			</div>

			<div class="field">
				<label for="company">업체명</label>
				<input type="text" id="company" name="company" maxlength="100"
				       autocomplete="off" required>
			</div>

			<div class="field">
				<label for="place">사용 장소</label>
				<input type="text" id="place" name="place" maxlength="100"
				       autocomplete="off" required>
			</div>

			<div class="field">
				<label for="purpose">사용 목적</label>
				<input type="text" id="purpose" name="purpose" maxlength="200"
				       autocomplete="off" required>
			</div>

			<div class="field">
				<label for="eventDate">사용 날짜<span class="optional">(예: 2026-09-01)</span></label>
				<input type="text" id="eventDate" name="eventDate"
				       inputmode="numeric" maxlength="10" autocomplete="off"
				       th:value="${startDate}" required>
			</div>

			<div class="field">
				<label for="content">행사 내용<span class="optional">(안 적으셔도 돼요)</span></label>
				<textarea id="content" name="content" rows="4" maxlength="2000"></textarea>
			</div>

			<button type="button" class="btn" id="toPhotoBtn">사진 고르기</button>
		</div>

		<!-- 사진은 photos 에 쌓인다. album 은 고르는 창을 여는 용도로만 쓴다.
		     multiple 이 있어야 파일 고르는 창에서 Shift/Ctrl 로 여러 장을 한 번에 고를 수 있다. -->
		<input type="file" id="album" accept="image/*" multiple class="hidden">
		<input type="file" id="photos" name="photos" multiple class="hidden">

		<!-- ===== 2단계: 사진 고르기 ===== -->
		<div id="step-photo" class="card hidden">
			<h1>사진을 골라 주세요</h1>

			<p class="summary" id="infoSummary">행사 정보</p>

			<label for="album" class="picker" id="picker">
				<span class="picker-art" aria-hidden="true">
					<span class="frame f1"></span>
					<span class="frame f2"></span>
					<span class="frame f3">🖼️</span>
				</span>
				<span class="picker-title" id="pickerTitle">앨범에서 고르기</span>
				<span class="picker-sub">여기를 누르면 사진첩이 열립니다</span>
			</label>
			<p class="hint">최소 3장 이상 필수입니다.</p>

			<div id="basket" class="hidden">
				<p class="count" id="countText">1장 담았어요</p>
				<div id="previews" class="previews-grid"></div>
			</div>

			<button type="submit" class="btn btn-send" id="sendBtn">사진 없이 일정만 저장하기</button>
			<button type="button" class="btn btn-retake" id="backBtn">행사 정보 다시 적기</button>
		</div>
	</form>

	<!-- ===== 보내는 중 ===== -->
	<div id="step-sending" class="sending hidden">
		<div class="spinner" aria-hidden="true"></div>
		보내는 중입니다...<br>잠깐만 기다려 주세요
	</div>
</main>

<script th:inline="javascript">
(function () {
	var MAX_COUNT = /*[[${maxCount}]]*/ 10;
	var MAX_EDGE = 1600; // 긴 변 기준. 통신이 느려도 금방 올라가도록 미리 줄인다.

	var album = document.getElementById('album');
	var photos = document.getElementById('photos');
	var picker = document.getElementById('picker');
	var pickerTitle = document.getElementById('pickerTitle');
	var form = document.getElementById('uploadForm');
	var previews = document.getElementById('previews');
	var countText = document.getElementById('countText');
	var basket = document.getElementById('basket');
	var stepInfo = document.getElementById('step-info');
	var stepPhoto = document.getElementById('step-photo');
	var stepSending = document.getElementById('step-sending');
	var stepBar = document.getElementById('stepBar');
	var stepLabel = document.getElementById('stepLabel');
	var stepMark2 = document.getElementById('stepMark2');
	var infoSummary = document.getElementById('infoSummary');

	var picked = [];
	var canStack = !!window.DataTransfer;

	if (!canStack) {
		document.querySelector('.hint').innerHTML =
			'이 휴대폰에서는 한 번에 한 장씩 보낼 수 있어요.';
	}

	album.addEventListener('change', function () {
		// Shift/Ctrl 로 여러 장을 한 번에 고를 수 있으므로 전부 받는다
		var chosen = Array.prototype.slice.call(album.files || []);
		if (!chosen.length) return;

		var room = MAX_COUNT - picked.length;
		if (room <= 0) {
			alert('사진은 한 번에 ' + MAX_COUNT + '장까지 보낼 수 있어요.');
			album.value = '';
			return;
		}
		if (chosen.length > room) {
			alert(chosen.length + '장을 고르셨는데, ' + room + '장만 더 담을 수 있어요.\n'
				+ '앞에서부터 ' + room + '장만 담겠습니다.');
			chosen = chosen.slice(0, room);
		}

		addAll(chosen, function () {
			album.value = ''; // 같은 사진을 다시 고를 수 있도록 비운다
			render();
		});
	});

	/** 고른 사진들을 모두 줄여서 담는다. 고른 순서가 그대로 유지된다. */
	function addAll(files, done) {
		var results = new Array(files.length);
		var remaining = files.length;

		files.forEach(function (file, i) {
			shrink(file, function (blob) {
				results[i] = blob
					? new File([blob], 'photo' + (i + 1) + '.jpg', { type: 'image/jpeg' })
					: file;
				if (--remaining === 0) {
					results.forEach(function (f) { picked.push(f); });
					done();
				}
			});
		});
	}

	function render() {
		countText.textContent = picked.length + '장 담았어요';

		previews.innerHTML = '';
		picked.forEach(function (file, index) {
			var box = document.createElement('div');
			box.className = 'thumb-box';

			var img = document.createElement('img');
			img.className = 'preview-thumb';
			img.alt = (index + 1) + '번째 사진';
			img.src = URL.createObjectURL(file);

			var remove = document.createElement('button');
			remove.type = 'button';
			remove.className = 'thumb-remove';
			remove.setAttribute('aria-label', (index + 1) + '번째 사진 빼기');
			remove.textContent = '✕';
			remove.addEventListener('click', function () {
				picked.splice(index, 1);
				render();
			});

			box.appendChild(img);
			box.appendChild(remove);
			previews.appendChild(box);
		});

		var hasPhotos = picked.length > 0;
		picker.classList.toggle('compact', hasPhotos);
		pickerTitle.textContent = hasPhotos ? '사진 더 고르기' : '앨범에서 고르기';
		basket.classList.toggle('hidden', !hasPhotos);

		// 사진이 없어도 저장할 수 있다는 걸 단추 문구로 알린다
		document.getElementById('sendBtn').textContent =
			hasPhotos ? '보내기' : '사진 없이 일정만 저장하기';
		syncToInput();
	}

	/** 모아 둔 사진을 실제로 전송될 input 에 담는다. */
	function syncToInput() {
		if (!canStack) return;
		try {
			var dt = new DataTransfer();
			picked.forEach(function (f) { dt.items.add(f); });
			photos.files = dt.files;
		} catch (e) {
			canStack = false;
		}
	}

	function showStep(n) {
		stepLabel.textContent = n + '단계 / 2단계';
		stepMark2.classList.toggle('on', n === 2);
	}

	/** 1단계에서 빠뜨린 칸이 있으면 그 칸을 짚어 준다. */
	function firstMissing() {
		var required = [
			['title', '행사 이름'],
			['company', '업체명'],
			['place', '사용 장소'],
			['purpose', '사용 목적'],
			['eventDate', '사용 날짜']
		];
		for (var i = 0; i < required.length; i++) {
			var el = document.getElementById(required[i][0]);
			if (!el.value.trim()) return { el: el, label: required[i][1] };
		}
		return null;
	}

	document.getElementById('toPhotoBtn').addEventListener('click', function () {
		var missing = firstMissing();
		if (missing) {
			alert(missing.label + '을(를) 적어 주세요.');
			missing.el.focus();
			return;
		}
		infoSummary.textContent =
			document.getElementById('title').value.trim() + ' · ' +
			document.getElementById('place').value.trim();

		stepInfo.classList.add('hidden');
		stepPhoto.classList.remove('hidden');
		showStep(2);
		window.scrollTo(0, 0);
	});

	document.getElementById('backBtn').addEventListener('click', function () {
		stepPhoto.classList.add('hidden');
		stepInfo.classList.remove('hidden');
		showStep(1);
		window.scrollTo(0, 0);
	});

	form.addEventListener('submit', function () {
		// 사진이 없어도 보낼 수 있다. 일정만 먼저 적어 두고 나중에 사진을 넣으면 된다.
		// 두 번 눌러 같은 사진이 두 번 올라가는 일을 막는다
		stepInfo.classList.add('hidden');
		stepPhoto.classList.add('hidden');
		stepBar.classList.add('hidden');
		stepSending.classList.remove('hidden');
	});

	function shrink(file, done) {
		if (!file.type.startsWith('image/') || !window.createImageBitmap) return done(null);
		createImageBitmap(file).then(function (bitmap) {
			var scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
			if (scale === 1) return done(null);
			var canvas = document.createElement('canvas');
			canvas.width = Math.round(bitmap.width * scale);
			canvas.height = Math.round(bitmap.height * scale);
			canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
			canvas.toBlob(done, 'image/jpeg', 0.85);
		}).catch(function () { done(null); });
	}
})();
</script>

</body>
</html>
