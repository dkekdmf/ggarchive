# ==========================================
# 배포(EC2) 설정 - EC2 안에 설치한 MySQL
# 실행: java -jar archive.jar --spring.profiles.active=prod
# ==========================================
#
# 비밀번호는 파일에 적지 말고 실행할 때 환경변수로 준다.
#   DB_PASSWORD=... ARCHIVE_ADMIN_PASSWORD=... java -jar archive.jar --spring.profiles.active=prod

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/archive?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:archive}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 를 쓰지 않으므로 콘솔도 확실히 닫아 둔다
spring.h2.console.enabled=false

# 운영에서는 화면 캐시를 켠다
spring.thymeleaf.cache=true

# 사진이 쌓이는 곳. 배포 폴더 바깥이어야 재배포해도 사진이 남는다.
archive.storage.type=local
archive.storage.location=${PHOTO_DIR:/home/ubuntu/uploads}
