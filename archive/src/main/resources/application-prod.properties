# EC2 배포용 설정. 실행할 때 --spring.profiles.active=prod 를 주면 기본 설정을 덮어쓴다.
# 예) java -jar archive.jar --spring.profiles.active=prod
#
# DB 서버(RDS)나 S3 를 쓰지 않고, EC2 안의 H2 파일과 디스크에 저장한다.

# 반드시 배포 폴더 바깥의 절대 경로. 여기 값이 곧 데이터의 수명이다.
spring.datasource.url=jdbc:h2:file:${DB_PATH:/home/ubuntu/archive-data/localdb};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 운영에서는 절대 켜지 말 것. 켜면 주소만 알면 DB 를 통째로 열람·삭제할 수 있다.
spring.h2.console.enabled=false

spring.thymeleaf.cache=true

# 사진이 쌓이는 곳. 배포 폴더 바깥이어야 재배포해도 남는다.
archive.storage.type=local
archive.storage.location=${PHOTO_DIR:/home/ubuntu/uploads}
