spring.application.name=archive
spring.docker.compose.enabled=false

# ==========================================
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/localdb};MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB
archive.upload.max-count=10


archive.storage.type=local
archive.storage.location=${PHOTO_DIR:./uploads}

archive.admin.password=${ARCHIVE_ADMIN_PASSWORD:0000}

server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=false

# Swagger UI ?? ?? ?? (http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# HTTP ???? ?? (GET, POST, PUT, DELETE ?)
springdoc.swagger-ui.operations-sorter=method

# ?? ?? ??
springdoc.swagger-ui.groups-order=desc

# ?? Swagger ?? URL ????
springdoc.swagger-ui.disable-swagger-default-url=true

# OpenAPI JSON ??? ?? ?? (???: /v3/api-docs)
springdoc.api-docs.path=/api-docs